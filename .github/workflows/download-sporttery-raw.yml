name: Download Sporttery raw pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'download_sporttery_raw.py'
      - '.github/workflows/download-sporttery-raw.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Download all historical Sporttery pages
        run: python download_sporttery_raw.py

      - name: Commit raw archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_raw/sporttery2026 || true
          if git diff --cached --quiet; then
            echo "No raw Sporttery data changes."
          else
            git commit -m "Archive historical World Cup Sporttery pages"
            git push
          fi
