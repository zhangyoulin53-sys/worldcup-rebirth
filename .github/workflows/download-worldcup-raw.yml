name: Download World Cup raw datasets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'download_worldcup_raw.py'
      - '.github/workflows/download-worldcup-raw.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Download and validate public datasets
        run: python download_worldcup_raw.py

      - name: Commit raw archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_raw/worldcup2026
          if git diff --cached --quiet; then
            echo "No raw data changes."
          else
            git commit -m "Archive 2026 World Cup schedule results and odds"
            git push
          fi
