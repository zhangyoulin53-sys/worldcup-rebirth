name: Import World Cup fixed bonuses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fetch_sporttery_fixed.py'
      - 'data-*.js'
      - '.github/workflows/import-fixed-bonus.yml'

permissions:
  contents: write

jobs:
  import-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch all 104 historical fixed-bonus markets
        run: python fetch_sporttery_fixed.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sporttery-fixed.js sporttery-fixed-report.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Import all 2026 World Cup fixed bonuses"
            git push
          fi
